name: Agent toolkit validation
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: python3 -m unittest discover -s tests -v
      - run: npm ci --prefix tools --ignore-scripts --no-fund
      - run: npm audit --prefix tools --omit=dev
      - run: tools/node_modules/.bin/cf --version
